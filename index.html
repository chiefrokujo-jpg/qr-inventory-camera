<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1769aa">
  <title>QR棚卸カメラ</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f2f5f7;color:#172b3a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    main{width:min(100%,600px);min-height:100vh;margin:auto;padding:16px;background:#fff} h1{text-align:center;margin:5px 0;font-size:27px}.subtitle{text-align:center;color:#62717b}
    .card{padding:16px;border:1px solid #d4dee6;border-radius:14px;box-shadow:0 2px 8px rgba(20,45,65,.06)}
    #reader{overflow:hidden;width:100%;min-height:280px;border-radius:12px;background:#111}
    button,a.button{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:12px;padding:12px;border:0;border-radius:10px;background:#1769aa;color:#fff;font-size:18px;font-weight:800;text-decoration:none;cursor:pointer}
    button.secondary{background:#5e6e79}.status{margin-top:12px;padding:13px;border-radius:9px;background:#e8f1fb;font-weight:800;white-space:pre-wrap}.status.ok{background:#e6f4ea;color:#137333}.status.bad{background:#fce8e6;color:#b3261e}.hidden{display:none!important}.result{display:none;margin-top:12px;padding:14px;border:2px solid #34a853;border-radius:10px;background:#e6f4ea;font-size:22px;font-weight:900;overflow-wrap:anywhere}.note{color:#62717b;font-size:14px;line-height:1.6}
  </style>
</head>
<body>
<main>
  <h1>QR棚卸カメラ</h1>
  <p class="subtitle">商品のQRコードを枠内に映してください</p>
  <section class="card">
    <div id="reader"></div>
    <button id="startButton" type="button">カメラを起動する</button>
    <button id="stopButton" class="secondary hidden" type="button">カメラを停止する</button>
    <div id="status" class="status">「カメラを起動する」を押してください。</div>
    <div id="result" class="result"></div>
    <a id="returnButton" class="button hidden" href="#">棚卸画面で商品を開く</a>
    <p class="note">このページはQR読取だけを行います。商品情報、数量、スタッフ名、管理者パスワードは保存しません。</p>
  </section>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const appUrl = String(params.get('app') || '').trim();
  const autoStart = String(params.get('autostart') || '') === '1';
  const startButton = document.getElementById('startButton');
  const stopButton = document.getElementById('stopButton');
  const statusBox = document.getElementById('status');
  const resultBox = document.getElementById('result');
  const returnButton = document.getElementById('returnButton');
  let scanner = null;
  let running = false;
  let completed = false;

  function status(text, type){statusBox.textContent=text;statusBox.className='status'+(type?' '+type:'')}
  function validQr(value){return /^[A-Z0-9][A-Z0-9-]{4,79}$/.test(value)}
  function destination(qr){if(!appUrl)return '';return appUrl+(appUrl.includes('?')?'&':'?')+'qr='+encodeURIComponent(qr)+'&camera=1'}

  async function start(){
    if(running)return; completed=false; resultBox.style.display='none'; returnButton.classList.add('hidden'); startButton.disabled=true; status('カメラを起動しています……');
    try{
      scanner=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE]});
      const size=Math.min(Math.max(Math.floor(innerWidth*.68),220),330);
      await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:size,height:size},aspectRatio:1},success,function(){});
      running=true; startButton.classList.add('hidden'); stopButton.classList.remove('hidden'); status('読み取り中です。QRコードを枠内に映してください。');
    }catch(error){startButton.disabled=false;startButton.classList.remove('hidden');status(cameraError(error),'bad')}
  }

  async function stop(){
    if(!scanner||!running)return;
    try{await scanner.stop();await scanner.clear()}catch(error){console.warn(error)}
    running=false;startButton.disabled=false;startButton.classList.remove('hidden');stopButton.classList.add('hidden');
  }

  async function success(decoded){
    if(completed)return;
    const qr=String(decoded||'').trim().toUpperCase();
    if(!validQr(qr)){status('棚卸用QRの形式ではありません。\n読み取り値：'+qr,'bad');return}
    completed=true;
    if(navigator.vibrate)navigator.vibrate(120);
    resultBox.textContent=qr;resultBox.style.display='block';status('QRコードを読み取りました。','ok');
    const url=destination(qr);
    if(url){returnButton.href=url;returnButton.classList.remove('hidden')}
    /* stop()の完了（カメラの解放）を待たずに遷移すると、遷移先で次のQRを読み取る際に
       カメラハードウェアがまだ解放されておらず起動に失敗することがあるため、
       stop()の完了は必ず待つ。表示用の180ms待機はその後に行い、
       カメラ解放待ちの時間で代用しない。 */
    await stop();
    if(url)setTimeout(function(){location.replace(url)},180);
  }

  function cameraError(error){
    /* html5-qrcodeはgetUserMedia失敗時、Errorオブジェクトではなく
       "Error getting userMedia, error = NotReadableError: ..." のような文字列で
       rejectすることがあるため、error.name/error.messageだけでなく
       文字列化した内容全体から実際の例外種別を判定する。 */
    const text=String((error&&(error.message||error.name))||error||'');
    if(/notallowederror|permission|denied/i.test(text))return 'カメラが許可されていません。ブラウザのサイト設定で許可してください。';
    if(/notfounderror|not found|no camera/i.test(text))return '利用できるカメラが見つかりません。';
    if(/notreadableerror|could not start video source/i.test(text))return 'ほかのアプリや画面がカメラを使用している可能性があります。少し待ってからもう一度お試しください。';
    if(/aborterror/i.test(text))return 'カメラの起動が中断されました。もう一度お試しください。';
    if(/overconstrainederror/i.test(text))return 'この端末のカメラに対応していない設定です。';
    return 'カメラを起動できませんでした。\n'+(text||'ブラウザと権限を確認してください。');
  }

  startButton.addEventListener('click',start);
  stopButton.addEventListener('click',async function(){await stop();status('カメラを停止しました。')});
  addEventListener('pagehide',function(){if(scanner&&running)scanner.stop().catch(function(){})});
  /* 固定350ms待機の代わりに、二重requestAnimationFrameで「最初の描画が済んだ直後」を
     待ってから起動する（画面がまだ描画されていない状態でのカメラ起動を避ける目的は
     維持しつつ、実際に必要な時間だけ待つ）。 */
  if(autoStart)requestAnimationFrame(function(){requestAnimationFrame(start)});
</script>
</body>
</html>
